services:
  postgres:
    image: postgres:16
    container_name: devops-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-devops_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devops} -d ${POSTGRES_DB:-devops_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  devops-api:
    build:
      context: .
      dockerfile: docker/DevOps.Api.Dockerfile
    container_name: devops-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-devops_platform};Username=${POSTGRES_USER:-devops};Password=${POSTGRES_PASSWORD:-dev_only_change_me}
      Ollama__Enabled: ${OLLAMA_ENABLED:-true}
      Ollama__BaseUrl: ${OLLAMA_BASE_URL:-http://ollama:11434}
      Ollama__Model: ${OLLAMA_MODEL:-llama3.1}
      Ollama__Timeout: ${OLLAMA_TIMEOUT:-00:04:00}
      Auth__Enabled: ${AUTH_ENABLED:-true}
      Auth__SigningKey: ${AUTH_SIGNING_KEY:-dev-only-change-me-use-a-32-char-key!}
      Docker__Enabled: "true"
      Docker__Endpoint: unix:///var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

  devops-worker:
    build:
      context: .
      dockerfile: docker/DevOps.Worker.Dockerfile
    container_name: devops-worker
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:9464
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-devops_platform};Username=${POSTGRES_USER:-devops};Password=${POSTGRES_PASSWORD:-dev_only_change_me}
      Monitoring__Interval: ${MONITORING_INTERVAL:-00:00:15}
      Monitoring__RequestTimeout: ${MONITORING_REQUEST_TIMEOUT:-00:00:05}
      Monitoring__DegradedResponseTimeMs: ${MONITORING_DEGRADED_RESPONSE_TIME_MS:-1000}
      Monitoring__UnhealthyFailureThreshold: ${MONITORING_UNHEALTHY_FAILURE_THRESHOLD:-3}
      Monitoring__OfflineUnreachablePeriod: ${MONITORING_OFFLINE_UNREACHABLE_PERIOD:-00:01:00}
      Monitoring__ContainerRestartIncidentThreshold: ${MONITORING_CONTAINER_RESTART_THRESHOLD:-3}
      Docker__Enabled: "true"
      Docker__Endpoint: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${WORKER_METRICS_PORT:-9464}:9464"
    depends_on:
      postgres:
        condition: service_healthy
      devops-api:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    container_name: devops-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s

  ollama-init:
    image: ollama/ollama:latest
    container_name: devops-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
    entrypoint: ["sh", "-c", "ollama pull $$OLLAMA_MODEL"]
    restart: "no"

  demo-unhealthy:
    image: nginx:alpine
    container_name: demo-unhealthy
    volumes:
      - ./demo/unhealthy-service/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8091:80"

  demo-restarting:
    image: alpine:3.20
    container_name: demo-restarting
    command: ["sh", "-c", "sleep 3; exit 1"]
    restart: on-failure

  demo-chaos:
    build:
      context: .
      dockerfile: docker/Demo.ChaosApi.Dockerfile
    container_name: demo-chaos
    ports:
      - "8092:8080"

  dashboard:
    build:
      context: .
      dockerfile: docker/Dashboard.Dockerfile
    container_name: devops-dashboard
    ports:
      - "${DASHBOARD_PORT:-8081}:80"
    depends_on:
      devops-api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: devops-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - devops-api
      - devops-worker

  grafana:
    image: grafana/grafana:11.3.1
    container_name: devops-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: dark
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  ollama_data:
